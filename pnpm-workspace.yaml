packages:
  - contracts
  - web
allowBuilds:
  esbuild: true
engineStrict: true
# better-auth 1.7.22 was published inside pnpm's minimum release age; pinned on purpose. Remove these
# entries once 1.7.22 is past the window (docs/specs/layer1-organisations-projects-people.md, APIs and assumptions).
minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.22'
  - '@better-auth/drizzle-adapter@1.7.22'
  - '@better-auth/kysely-adapter@1.7.22'
  - '@better-auth/memory-adapter@1.7.22'
  - '@better-auth/mongo-adapter@1.7.22'
  - '@better-auth/passkey@1.7.22'
  - '@better-auth/prisma-adapter@1.7.22'
  - '@better-auth/telemetry@1.7.22'
  - better-auth@1.7.22
