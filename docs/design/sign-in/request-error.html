<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - XR Studio</title>
<link rel="stylesheet" href="../wireframe.css">
</head>
<body>
<p class="state-label">Wireframe. State: email missing or not an email address</p>
<a class="skip" href="#main">Skip to main content</a>
<header class="app"><span class="brand">XR Studio</span></header>
<main id="main" class="narrow">
<div class="error-summary" role="alert" tabindex="-1">
<h2>There is a problem</h2>
<ul><li><a href="#email">Enter an email address, like name@example.com.</a></li></ul>
</div>
<h1>Sign in</h1>
<p class="lead">We will email you a link that signs you in. No password needed.</p>
<form>
<div class="field">
  <label for="email">Email address</label>
  <span class="error-message" id="email-error">Enter an email address, like name@example.com.</span>
  <input type="email" id="email" name="email" autocomplete="username webauthn" value="jordan@example" aria-invalid="true" aria-describedby="email-error">
</div>
<div class="actions"><button type="submit">Email me a sign-in link</button></div>
</form>
</main>
</body>
</html>
