<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error: Sign in - XR Studio</title>
<link rel="stylesheet" href="../wireframe.css">
</head>
<body>
<p class="state-label">Wireframe. State: passkey cancelled or not found</p>
<a class="skip" href="#main">Skip to main content</a>
<header class="app"><span class="brand">XR Studio</span></header>
<main id="main" class="narrow">
<div class="notice" role="alert" tabindex="-1"><p>That passkey did not work. No passkey for XR Studio was found on this device, or the request was cancelled. Try again, or get an email link.</p></div>
<h1>Sign in</h1>
<div class="actions"><button type="button">Try the passkey again</button></div>
<h2>Or get an email link</h2>
<form>
<div class="field"><label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="username webauthn"></div>
<div class="actions"><button type="submit" class="secondary">Email me a sign-in link</button></div>
</form>
</main>
</body>
</html>
