<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - XR Studio</title>
<link rel="stylesheet" href="../wireframe.css">
</head>
<body>
<p class="state-label">Wireframe. State: request a sign-in link (default)</p>
<a class="skip" href="#main">Skip to main content</a>
<header class="app"><span class="brand">XR Studio</span></header>
<main id="main" class="narrow">
<h1>Sign in</h1>
<p class="lead">We will email you a link that signs you in. No password needed.</p>
<form>
<div class="field">
  <label for="email">Email address</label>
  
  <input type="email" id="email" name="email" autocomplete="username webauthn" value="">
</div>
<div class="actions"><button type="submit">Email me a sign-in link</button></div>
</form>
<h2>Or use a passkey</h2>
<p>If you added a passkey on this device, you can sign in with it.</p>
<div class="actions"><button type="button" class="secondary">Sign in with a passkey</button></div>
</main>
</body>
</html>
